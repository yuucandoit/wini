services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wini-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SECTORS_API_KEY=${SECTORS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: wini-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
